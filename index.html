<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una lettera per te</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;700&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: una colonna centratas su fondo blu da festa. Busta gialla, poi la lettera su carta rigata con polaroid, torta e palloncini. */
:root {
  --sky: #2340d9;
  --sky-deep: #1a2fa8;
  --paper: #fffdf8;
  --ink: #1c1b3a;
  --sun: #ffc933;
  --sun-deep: #eaa300;
  --pink: #ff4f8b;
  --mint: #2fd1a6;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
html, body { min-height: 100%; }
body {
  background-color: var(--sky);
  background-image: radial-gradient(rgba(255,255,255,.14) 1.6px, transparent 1.7px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 28px 56px;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
.kicker {
  margin: 0; text-align: center; color: #fff; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; font-size: .8rem;
}

/* ---------- Busta ---------- */
.stage { display: flex; flex-direction: column; align-items: center; gap: 28px; transition: opacity .5s, transform .5s; padding-top: 70px; }
.stage.gone { opacity: 0; transform: scale(.9); pointer-events: none; }
.env { position: relative; width: min(340px, 86vw); aspect-ratio: 3 / 2; perspective: 900px; border: 0; background: none; padding: 0; cursor: pointer; }
.env:focus-visible { outline: 4px solid #fff; outline-offset: 10px; border-radius: 12px; }
.env > * { position: absolute; }
.env-back { inset: 0; background: var(--sun-deep); border-radius: 10px; z-index: 0; box-shadow: 0 18px 0 -6px rgba(0,0,0,.18); }
.mini {
  left: 7%; right: 7%; top: 5%; height: 86%; background: var(--paper); border-radius: 6px; z-index: 1;
  padding: 16px 16px 0; display: flex; flex-direction: column; gap: 9px;
  transition: transform .8s cubic-bezier(.3,1.3,.5,1) .45s;
}
.mini i { display: block; height: 6px; border-radius: 3px; background: rgba(35,64,217,.25); }
.mini i:nth-child(1) { width: 55%; background: var(--pink); height: 9px; }
.mini i:nth-child(3) { width: 80%; }
.env-front {
  inset: 0; z-index: 2; background: var(--sun); border-radius: 10px;
  clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
}
.flap {
  left: 0; right: 0; top: 0; height: 60%; z-index: 3; background: #ffd75e;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .6s ease, z-index 0s .3s;
}
.seal {
  left: 50%; top: 58%; width: 54px; height: 54px; margin: -27px 0 0 -27px; z-index: 4; border-radius: 50%;
  background: var(--pink); color: #fff; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.5rem; box-shadow: 0 4px 0 rgba(0,0,0,.2);
  transition: opacity .3s, transform .3s;
  animation: pulse 1.8s ease-in-out infinite;
}
.open .flap { transform: rotateX(180deg); z-index: 0; }
.open .mini { transform: translateY(-62%); }
.open .seal { opacity: 0; transform: scale(.4); animation: none; }
@keyframes pulse { 50% { transform: scale(1.12); } }

.btn {
  font-family: var(--font-ui); font-weight: 700; font-size: 1rem; cursor: pointer;
  border: 0; border-radius: 999px; padding: 13px 26px; color: var(--ink); background: var(--sun);
  box-shadow: 0 5px 0 var(--sun-deep); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-deep); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #c21e5c; }
.btn.pink:active { box-shadow: 0 1px 0 #c21e5c; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); }
.hint { margin: 0; color: #fff; font-family: var(--font-hand); font-size: 1.5rem; text-align: center; }

/* ---------- Lettera ---------- */
.letter {
  background: var(--paper); border-radius: 6px; padding: clamp(22px, 5vw, 38px);
  box-shadow: 0 24px 0 -10px rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.06);
  display: flex; flex-direction: column; gap: 26px; min-width: 0;
}
.letter.rise { animation: rise .9s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(60px) rotate(-3deg) scale(.92); } to { opacity: 1; transform: none; } }
.letter h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.05;
  font-size: clamp(2rem, 9vw, 3.1rem); text-wrap: balance; overflow-wrap: anywhere;
}
.letter h1 .nm { color: var(--pink); display: inline-block; transform: rotate(-2deg); }
.polaroid {
  align-self: center; width: min(300px, 100%); background: #fff; padding: 12px 12px 14px; border: 0;
  box-shadow: 0 8px 0 -2px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.05);
  transform: rotate(-3deg); cursor: pointer; text-align: center; color: var(--ink); transition: transform .25s;
}
.polaroid:hover { transform: rotate(1.5deg) scale(1.03); }
.polaroid:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; }
.shot {
  display: grid; place-items: center; aspect-ratio: 1; width: 100%; overflow: hidden;
  background: linear-gradient(135deg, var(--sun) 0 50%, var(--mint) 50% 100%);
  font-family: var(--font-hand); font-size: 1.6rem; line-height: 1.1; padding: 18px;
}
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap { display: block; margin-top: 10px; font-family: var(--font-hand); font-size: 1.6rem; line-height: 1.1; overflow-wrap: anywhere; }
.msg {
  margin: 0; font-family: var(--font-hand); font-weight: 500; font-size: 1.55rem; line-height: 2rem; white-space: pre-wrap; overflow-wrap: anywhere;
  background-image: repeating-linear-gradient(transparent 0, transparent calc(2rem - 1px), rgba(35,64,217,.2) calc(2rem - 1px), rgba(35,64,217,.2) 2rem);
  min-width: 0;
}
.sign { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 1.7rem; text-align: right; line-height: 1.1; }
.sign b { color: var(--pink); }
.sec { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 22px; border-top: 3px dotted rgba(35,64,217,.35); text-align: center; }
.sec h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; }
.sec p { margin: 0; font-size: .95rem; opacity: .8; }

/* Torta */
.cake { width: min(260px, 100%); height: auto; overflow: visible; }
.candle { cursor: pointer; }
.candle:focus-visible { outline: none; }
.candle:focus-visible .wick { stroke: var(--sky); stroke-width: 3; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; transition: transform .25s, opacity .25s; }
.candle.out .flame { transform: scale(0); opacity: 0; animation: none; }
.candle:nth-child(2) .flame { animation-delay: -.2s; }
.candle:nth-child(3) .flame { animation-delay: -.35s; }
@keyframes flick { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(.88, 1.12) rotate(4deg); } }

/* Palloncini */
.balloons { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
.balloon { border: 0; background: none; padding: 0; cursor: pointer; animation: bob 2.6s ease-in-out infinite; }
.balloon:nth-child(2) { animation-delay: -.8s; }
.balloon:nth-child(3) { animation-delay: -1.6s; }
.balloon svg { display: block; width: 64px; height: auto; transition: transform .1s; }
.balloon:active svg { transform: scale(1.15); }
.balloon:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; border-radius: 30px; }
.balloon.popped { visibility: hidden; animation: none; }
@keyframes bob { 50% { transform: translateY(-9px) rotate(2deg); } }

.row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px; padding-top: 22px; border-top: 3px dotted rgba(35,64,217,.35); }
#no { transition: transform .18s ease-out; }
.again { align-self: center; margin-top: -6px; background: none; border: 0; color: var(--sky); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 6px; }

/* ---------- Pannello ---------- */
.custom { background: rgba(255,255,255,.12); border-radius: 14px; color: #fff; }
.custom summary { cursor: pointer; padding: 14px 18px; font-weight: 700; }
.custom summary:focus-visible { outline: 3px solid #fff; outline-offset: -3px; border-radius: 14px; }
.fields { display: grid; gap: 14px; padding: 0 18px 18px; }
.fields label { display: grid; gap: 5px; font-size: .85rem; font-weight: 700; letter-spacing: .04em; }
.fields input, .fields textarea {
  font: inherit; font-weight: 500; letter-spacing: 0; color: var(--ink); background: var(--paper);
  border: 0; border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
.fields textarea { min-height: 130px; resize: vertical; }
.fields input:focus-visible, .fields textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 440px) { .two { grid-template-columns: 1fr; } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 24px); opacity: 0; transition: opacity .25s, transform .25s;
  background: var(--ink); color: #fff; font-weight: 700; padding: 12px 20px; border-radius: 999px;
  width: max-content; max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Posta prioritaria</p>

  <section class="stage" id="stage">
    <button class="env" id="env" type="button" aria-label="Apri la busta">
      <span class="env-back"></span>
      <span class="mini"><i></i><i></i><i></i><i></i></span>
      <span class="env-front"></span>
      <span class="flap"></span>
      <span class="seal" aria-hidden="true">A</span>
    </button>
    <p class="hint">Tocca la busta, c'è qualcosa per te</p>
    <button class="btn" id="open" type="button">Apri la lettera</button>
  </section>

  <article class="letter" id="letter" hidden>
    <h1>Buon compleanno, <span class="nm" id="o-name">Marinella</span>!</h1>

    <button class="polaroid" id="polaroid" type="button" aria-label="Cambia la foto">
      <span class="shot" id="shot"><span id="shot-ph">Tocca qui per mettere la tua foto</span></span>
      <span class="cap" id="o-cap">Foto provatoria dell'avvicinamento alla pensione</span>
    </button>

    <p class="msg" id="o-msg"></p>
    <p class="sign">Con affetto,<br><b id="o-from">Pasquale</b></p>

    <section class="sec" aria-labelledby="h-cake">
      <h2 id="h-cake">Esprimi un desiderio</h2>
      <svg class="cake" viewBox="0 0 240 190" role="group" aria-label="Torta con tre candeline">
        <ellipse cx="120" cy="172" rx="112" ry="13" fill="#d9d6ea"/>
        <rect x="26" y="112" width="188" height="58" rx="10" fill="#ff4f8b"/>
        <rect x="52" y="74" width="136" height="42" rx="9" fill="#2fd1a6"/>
        <path d="M52 86 q11 14 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 v-12 a9 9 0 0 0 -9 -9 h-110 a9 9 0 0 0 -9 9z" fill="#fffdf8"/>
        <path d="M26 124 q11 14 23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 t23 0 v-12 h-161z" fill="#fffdf8"/>
        <circle cx="80" cy="146" r="5" fill="#ffc933"/><circle cx="120" cy="150" r="5" fill="#ffc933"/><circle cx="160" cy="146" r="5" fill="#ffc933"/>
        <g class="candle" tabindex="0" role="button" aria-label="Candelina 1, tocca per spegnere">
          <rect x="88" y="42" width="10" height="26" rx="3" fill="#ffc933"/><line class="wick" x1="93" y1="42" x2="93" y2="36" stroke="#1c1b3a" stroke-width="2" stroke-linecap="round"/>
          <path class="flame" d="M93 14 c9 10 8 18 0 22 c-8 -4 -9 -12 0 -22z" fill="#ff8a1f"/>
          <rect x="80" y="10" width="26" height="62" fill="transparent"/>
        </g>
        <g class="candle" tabindex="0" role="button" aria-label="Candelina 2, tocca per spegnere">
          <rect x="115" y="38" width="10" height="26" rx="3" fill="#ff4f8b"/><line class="wick" x1="120" y1="38" x2="120" y2="32" stroke="#1c1b3a" stroke-width="2" stroke-linecap="round"/>
          <path class="flame" d="M120 10 c9 10 8 18 0 22 c-8 -4 -9 -12 0 -22z" fill="#ff8a1f"/>
          <rect x="107" y="6" width="26" height="62" fill="transparent"/>
        </g>
        <g class="candle" tabindex="0" role="button" aria-label="Candelina 3, tocca per spegnere">
          <rect x="142" y="42" width="10" height="26" rx="3" fill="#2340d9"/><line class="wick" x1="147" y1="42" x2="147" y2="36" stroke="#1c1b3a" stroke-width="2" stroke-linecap="round"/>
          <path class="flame" d="M147 14 c9 10 8 18 0 22 c-8 -4 -9 -12 0 -22z" fill="#ff8a1f"/>
          <rect x="134" y="10" width="26" height="62" fill="transparent"/>
        </g>
      </svg>
      <button class="btn" id="blow" type="button">Soffia</button>
    </section>

    <section class="sec" aria-labelledby="h-bal">
      <h2 id="h-bal">Scoppia un palloncino (sono le palle che ti fanno scoppiare i colleghi)</h2>
      <div class="balloons" id="balloons">
        <button class="balloon" type="button" aria-label="Palloncino rosa"><svg viewBox="0 0 64 100"><path d="M32 4 C 6 4 2 40 22 58 L 32 64 L 42 58 C 62 40 58 4 32 4z" fill="#ff4f8b"/><path d="M32 64 l-5 7 h10z" fill="#c21e5c"/><path d="M32 71 q-8 12 0 22" stroke="#1c1b3a" stroke-width="2" fill="none"/><ellipse cx="21" cy="22" rx="5" ry="9" fill="#fff" opacity=".35" transform="rotate(25 21 22)"/></svg></button>
        <button class="balloon" type="button" aria-label="Palloncino giallo"><svg viewBox="0 0 64 100"><path d="M32 4 C 6 4 2 40 22 58 L 32 64 L 42 58 C 62 40 58 4 32 4z" fill="#ffc933"/><path d="M32 64 l-5 7 h10z" fill="#eaa300"/><path d="M32 71 q-8 12 0 22" stroke="#1c1b3a" stroke-width="2" fill="none"/><ellipse cx="21" cy="22" rx="5" ry="9" fill="#fff" opacity=".45" transform="rotate(25 21 22)"/></svg></button>
        <button class="balloon" type="button" aria-label="Palloncino verde"><svg viewBox="0 0 64 100"><path d="M32 4 C 6 4 2 40 22 58 L 32 64 L 42 58 C 62 40 58 4 32 4z" fill="#2fd1a6"/><path d="M32 64 l-5 7 h10z" fill="#17a07d"/><path d="M32 71 q-8 12 0 22" stroke="#1c1b3a" stroke-width="2" fill="none"/><ellipse cx="21" cy="22" rx="5" ry="9" fill="#fff" opacity=".4" transform="rotate(25 21 22)"/></svg></button>
      </div>
    </section>

    <div class="row" id="row">
      <button class="btn pink" id="yes" type="button">Grazie!</button>
      <button class="btn ghost" id="no" type="button">No grazie</button>
    </div>
    <button class="again" id="again" type="button">Rileggi dall'inizio</button>
  </article>

  <details class="custom" id="custom" hidden>
    <summary>Personalizza la lettera</summary>
    <div class="fields">
      <div class="two">
        <label for="f-name">Per chi è
          <input id="f-name" type="text" value="Marinella" maxlength="40" autocomplete="off">
        </label>
        <label for="f-from">Firma
          <input id="f-from" type="text" value="Pasquale" maxlength="40" autocomplete="off">
        </label>
      </div>
      <label for="f-msg">Dedica
        <textarea id="f-msg" maxlength="700"></textarea>
      </label>
      <label for="f-cap">Scritta sotto la foto
        <input id="f-cap" type="text" value="La tua faccia migliore (la meno peggio)" maxlength="60" autocomplete="off">
      </label>
      <label for="f-photo">Foto
        <input id="f-photo" type="file" accept="image/*">
      </label>
    </div>
  </details>
</main>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DEFAULT_MSG = "Auguri di buon compleanno al mio socio in affari! Ad un anno ricco di investimenti di dubbia profittevolezza (parola cercata in quanto non presente nel mio vocabolario),applicazioni fatte male e messaggi ai quali non riceverò risposta repentina";
  $('f-msg').value = DEFAULT_MSG;
  $('o-msg').textContent = DEFAULT_MSG;

  /* Foto: percorso relativo (stessa cartella della pagina) oppure URL completo del tuo server.
     Esempi: 'foto.jpg'  oppure  'http://192.168.1.10:8080/foto.jpg' */
  var PHOTO_URL = 'foto.jpg';
  function setPhoto(src) {
    var img = new Image(); img.alt = 'Foto della dedica';
    img.onload = function () { var shot = $('shot'); shot.textContent = ''; shot.appendChild(img); };
    img.src = src; /* se non carica, resta il segnaposto */
  }
  setPhoto(PHOTO_URL);

  /* ---------- Coriandoli ---------- */
  var cv = $('fx'), ctx = cv.getContext('2d'), parts = [], running = false;
  var COLORS = ['#ff4f8b', '#ffc933', '#2fd1a6', '#ffffff', '#2340d9', '#ff8a1f'];
  function fit() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  fit(); window.addEventListener('resize', fit);
  function burst(x, y, n) {
    n = reduce ? 14 : (n || 90);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[(Math.random() * COLORS.length) | 0] });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(function (p) { return p.y < cv.height + 30; });
    parts.forEach(function (p) {
      p.vy += .28; p.vx *= .985; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function burstAt(el, n) { var r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

  var toastTimer;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  /* ---------- Apertura ---------- */
  var opened = false;
  function openEnvelope() {
    if (opened) return; opened = true;
    $('env').classList.add('open'); $('env').setAttribute('aria-label', 'Busta aperta');
    $('open').disabled = true;
    burstAt($('env'), 70);
    setTimeout(function () {
      $('stage').classList.add('gone');
      setTimeout(function () {
        $('stage').hidden = true;
        var l = $('letter'); l.hidden = false; l.classList.add('rise');
        l.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        burst(window.innerWidth / 2, window.innerHeight * .3, 110);
      }, 450);
    }, 1500);
  }
  $('env').addEventListener('click', openEnvelope);
  $('open').addEventListener('click', openEnvelope);

  $('again').addEventListener('click', function () {
    opened = false;
    $('letter').hidden = true; $('letter').classList.remove('rise');
    $('stage').hidden = false; $('stage').classList.remove('gone');
    $('env').classList.remove('open'); $('env').setAttribute('aria-label', 'Apri la busta');
    $('open').disabled = false;
    resetCandles(); resetBalloons();
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  /* ---------- Candeline ---------- */
  var candles = Array.prototype.slice.call(document.querySelectorAll('.candle'));
  var blowing = false;
  function litCount() { return candles.filter(function (c) { return !c.classList.contains('out'); }).length; }
  function checkWish() {
    if (litCount() === 0) {
      $('blow').textContent = 'Riaccendi';
      burstAt(document.querySelector('.cake'), 100);
      toast('Desiderio registrato. Non dirlo a nessuno.');
    }
  }
  function resetCandles() { candles.forEach(function (c) { c.classList.remove('out'); }); $('blow').textContent = 'Soffia'; blowing = false; }
  candles.forEach(function (c) {
    function go() { if (!c.classList.contains('out')) { c.classList.add('out'); checkWish(); } }
    c.addEventListener('click', go);
    c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('blow').addEventListener('click', function () {
    if (litCount() === 0) { resetCandles(); return; }
    if (blowing) return; blowing = true;
    var lit = candles.filter(function (c) { return !c.classList.contains('out'); });
    lit.forEach(function (c, i) {
      setTimeout(function () { c.classList.add('out'); if (i === lit.length - 1) { blowing = false; checkWish(); } }, 260 * (i + 1));
    });
  });

  /* ---------- Palloncini ---------- */
  var JOKES = [
    'Pop! Un anno in meno di cui preoccuparsi.',
    'Questo palloncino era assicurato. Adesso no.',
    'Ti ha sentito arrivare ed è scoppiato.',
    'Contenuto: aria fresca e tanti auguri.',
    'Hai appena scoppiato il mio budget per le decorazioni.'
  ];
  var popped = 0;
  var bals = Array.prototype.slice.call(document.querySelectorAll('.balloon'));
  bals.forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.classList.contains('popped')) return;
      burstAt(b, 45); b.classList.add('popped'); popped++;
      toast(popped === bals.length ? 'Palloncini finiti. Ora tocca alla torta.' : JOKES[(Math.random() * JOKES.length) | 0]);
    });
  });
  function resetBalloons() { bals.forEach(function (b) { b.classList.remove('popped'); }); popped = 0; }

  /* ---------- Bottoni finali ---------- */
  var no = $('no'), dodges = 0, tame = false;
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function dodge() {
    if (tame) return;
    dodges++;
    if (dodges >= 6) { tame = true; no.style.transform = ''; no.textContent = 'Pasquale sei meraviglioso'; return; }
    no.style.transition = 'none'; no.style.transform = '';
    var r = no.getBoundingClientRect();
    var dx = clamp((Math.random() - .5) * 280, 16 - r.left, window.innerWidth - 16 - r.right);
    var dy = (Math.random() - .5) * 120;
    void no.offsetWidth; no.style.transition = ''; no.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', function () {
    if (!tame) return;
    burstAt(no, 100); toast('Lo so faccio questo effetto.');
  });
  $('yes').addEventListener('click', function () { burstAt($('yes'), 130); toast('Sono 5 euro per il fastidio + 3 euro per il deploy dell\'app.'); });

  /* ---------- Personalizzazione ---------- */
  function bind(inp, out, fallback) {
    $(inp).addEventListener('input', function () { $(out).textContent = this.value.trim() || fallback; });
  }
  bind('f-name', 'o-name', 'amico');
  bind('f-from', 'o-from', 'Un amico');
  bind('f-msg', 'o-msg', '');
  bind('f-cap', 'o-cap', '');
  $('f-photo').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { setPhoto(rd.result); };
    rd.readAsDataURL(f);
  });
  $('polaroid').addEventListener('click', function () { $('custom').open = true; $('f-photo').click(); });
})();
</script>
</body>
</html>
